<!-- components/screen1.html -->
<div class="screen1-container">
  <!-- 상단 고정 헤더 -->
  <header class="gamza-header" id="mainHeader">
    <div class="header-inner">
      <!-- 서비스 로고 -->
      <div class="header-logo">
        <a href="#" class="logo-link" id="logoBtn" title="감자 홈으로 이동">
          <span class="logo-text">감자</span>
          <span class="logo-emoji" aria-hidden="true">🥔</span>
        </a>
      </div>

      <!-- 검색창 -->
      <div class="header-search">
        <form class="search-form" id="searchForm" onsubmit="return false;">
          <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input 
              type="text" 
              id="searchInput" 
              class="search-input" 
              placeholder="물품명, 동네명 등을 검색해보세요" 
              autocomplete="off" 
              aria-label="상품 및 지역 검색"
            />
            <button type="button" id="searchClearBtn" class="search-clear-btn" aria-label="검색어 지우기" style="display: none;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <button type="submit" id="searchBtn" class="search-submit-btn" aria-label="검색 실행">검색</button>
        </form>
      </div>

      <!-- 헤더 우측 액션 버튼들 -->
      <div class="header-actions">
        <!-- 수파베이스 DB 실시간 연동 뱃지 -->
        <div class="db-badge" title="Supabase Cloud DB와 실시간 연결되어 있습니다." style="display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; color: #047857; background: #ecfdf5; border: 1px solid #a7f3d0; padding: 6px 12px; border-radius: 9999px; font-weight: 600;">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #10b981; display: inline-block; box-shadow: 0 0 0 2px #d1fae5;"></span>
          <span>Supabase DB 연결됨</span>
        </div>

        <!-- 글쓰기 버튼 -->
        <button type="button" id="writeBtn" class="btn btn-primary header-write-btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          <span class="btn-text">글쓰기</span>
        </button>

        <!-- 로그인 전: [로그인] 버튼 -->
        <button type="button" id="loginBtn" class="btn btn-outline header-login-btn">
          <span>로그인</span>
        </button>

        <!-- 로그인 후: [닉네임 + 작은 프로필 사진] 버튼 (클릭 시 회원 정보 수정) -->
        <button type="button" id="nicknameBtn" class="btn header-nickname-btn" style="display:none;" title="클릭하여 회원 정보 수정">
          <img id="headerProfileImg" src="" alt="프로필" class="header-profile-avatar" style="display:none;" />
          <span id="nicknameBtnText">감자유저</span>
          <svg class="header-profile-edit-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
        </button>

        <!-- 로그인 후: [로그아웃] 버튼 -->
        <button type="button" id="logoutBtn" class="btn btn-outline-danger header-logout-btn" style="display:none;">
          <span>로그아웃</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 본문 래퍼 -->
  <div class="screen1-content-wrap">
    <!-- 서브바: 카테고리 칩 목록 + 거래 가능 필터 -->
    <section class="filter-bar" aria-label="카테고리 및 필터">
      <div class="filter-bar-inner">
        <!-- 스크롤 가능한 카테고리 가로 칩 -->
        <nav class="category-nav" aria-label="카테고리 목록">
          <div class="category-chips-wrapper" id="categoryChips">
            <button type="button" class="category-chip active" data-category="전체">전체</button>
            <button type="button" class="category-chip" data-category="디지털기기">디지털기기</button>
            <button type="button" class="category-chip" data-category="가구/인테리어">가구/인테리어</button>
            <button type="button" class="category-chip" data-category="의류">의류</button>
            <button type="button" class="category-chip" data-category="생활가전">생활가전</button>
            <button type="button" class="category-chip" data-category="도서/티켓">도서/티켓</button>
            <button type="button" class="category-chip" data-category="기타">기타</button>
          </div>
        </nav>

        <!-- '거래 가능만 보기' 토글 스위치 -->
        <div class="filter-toggle-container">
          <label class="toggle-switch-label" for="availableOnlyToggle">
            <input type="checkbox" id="availableOnlyToggle" class="toggle-input" />
            <span class="toggle-slider" aria-hidden="true"></span>
            <span class="toggle-text">거래 가능만 보기</span>
          </label>
        </div>
      </div>
    </section>

    <!-- 상품 목록 메인 컨테이너 -->
    <main class="product-main-section">
      <div class="product-section-header">
        <h2 class="section-title" id="listTitle">오늘의 감자 마켓</h2>
        <span class="product-count" id="productCount"></span>
      </div>

      <!-- 상품 카드 그리드 영역 -->
      <div class="product-grid" id="productList" role="region" aria-label="상품 목록">
        <!-- js/screen1.js 에서 동적으로 렌더링됩니다 -->
      </div>

      <!-- 검색/필터 결과 없을 때 빈 상태 안내 문구 -->
      <div class="empty-state" id="emptyState" style="display: none;" role="status">
        <div class="empty-state-icon" aria-hidden="true">🥔</div>
        <h3 class="empty-state-title">검색된 상품이 없어요</h3>
        <p class="empty-state-message">
          다른 검색어를 입력하시거나<br />
          필터 조건을 다시 확인해보세요.
        </p>
        <button type="button" class="btn btn-outline empty-reset-btn" id="emptyResetBtn">
          필터 및 검색 초기화
        </button>
      </div>
    </main>
  </div>
</div>
